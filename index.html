<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لـ Jojo ❤️</title>
<style>
body{margin:0;font-family:sans-serif;background:#ffeef5;text-align:center;color:#ff2e7e}
.card{background:white;margin:40px 20px;padding:30px;border-radius:25px}
h1{font-size:32px} p{color:#444;font-size:18px;line-height:1.8}
button{background:#ff2e7e;color:white;border:0;padding:15px 30px;border-radius:50px;font-size:20px}
#msg{display:none;margin-top:20px;font-size:20px;color:#333}
.heart{font-size:50px}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1>Jojo .. دي ليكي انتي بس</h1>
<p>عملتلك الموقع ده مخصوص عشان اقولك انك احلى حاجة حصلتلي</p>
<button onclick="document.getElementById('msg').style.display='block';this.style.display='none'">افتحي الهدية 🎁</button>
<div id="msg">بحبك اوي يا Jojo ❤️<br>انتي اغلى حد عندي في الدنيا كلها<br>وكل يوم معاكي احلى من اللي قبله</div>
</div>
</body>
</html>
